<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ページが見つかりません — 404</title>
  <!-- エラーページテンプレート（mitsubachi-ui 公式 pages/404 由来。そのまま使える。
       グロナビやヘッダー・フッターと組み合わせて使用する想定。
       ボタンの「{ページ名}」と遷移先だけ差し替える -->
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../mitsubachi-mockup.css">
  <style>
    /* 公式 pages/404 のページレイアウト（そのまま移植） */
    body { margin: 0; background: #ffffff; font-family: Arial, "Hiragino Sans", Meiryo, sans-serif; color: rgba(0, 0, 0, 0.84); }
    .errorPage { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .errorPage__content { text-align: center; }
    .errorPage__code { margin: 0; line-height: 1; }
    .errorPage__title { margin: 40px 0 0; font-size: 20px; font-weight: 400; }
    .errorPage__description { margin: 12px 0 0; font-size: 14px; color: #666; }
    .errorPage__action { margin-top: 24px; }
  </style>
</head>
<body>
  <div class="errorPage">
    <div class="errorPage__content">
      <p class="errorPage__code" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="225" height="97" viewBox="0 0 225 97" fill="none">
          <path d="M58.08 94.1398H42.72V74.3398H0V60.1798L38.28 2.33984H57.96V61.0198H71.04V74.3398H58.08V94.1398ZM42.48 19.4998L16.08 61.0198H42.84V19.4998H42.48Z" fill="#ACACAC"/>

          <path d="M211.72 94.1398H196.36V74.3398H153.64V60.1798L191.92 2.33984H211.6V61.0198H224.68V74.3398H211.72V94.1398ZM196.12 19.4998L169.72 61.0198H196.48V19.4998H196.12Z" fill="#ACACAC"/>
        </svg>
      </p>
      <h1 class="errorPage__title">ご指定のページは見つかりませんでした</h1>
      <p class="errorPage__description">アクセスしたURLが間違っているか、ページが移動または削除された可能性があります。</p>
      <div class="errorPage__action">
        <button class="mi-button mi-button--tertiary mi-button--large">{ページ名}へ戻る</button>
      </div>
    </div>
  </div>
</body>
</html>
