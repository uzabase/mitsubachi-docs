<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>システムエラー — 500</title>
  <!-- エラーページテンプレート（mitsubachi-ui 公式 pages/500 由来。そのまま使える。
       グロナビやヘッダー・フッターと組み合わせて使用する想定。
       ボタンの「{ページ名}」と遷移先だけ差し替える -->
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../mitsubachi-mockup.css">
  <style>
    /* ds-exception: 公式 pages/500 のページレイアウトをそのまま移植（数字グリフと
       文言のスタイルは kit にコンポーネントが無い）。この申告以降のルールが免除される */
    body { margin: 0; background: #ffffff; font-family: var(--typography-font-family, Arial, sans-serif); color: rgba(0, 0, 0, 0.84); }
    .errorPage { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .errorPage__content { text-align: center; }
    .errorPage__code { margin: 0; line-height: 1; }
    .errorPage__title { margin: 40px 0 0; font-size: 20px; font-weight: 400; }
    .errorPage__description { margin: 12px 0 0; font-size: 14px; color: #666; }
    .errorPage__action { margin-top: 24px; }
  </style>
</head>
<body>
  <div class="errorPage">
    <div class="errorPage__content">

      <h1 class="errorPage__title">システムエラーが発生しました</h1>
      <p class="errorPage__description">しばらく時間をおいてからもう一度お試しください。</p>
      <div class="errorPage__action">
        <button class="mi-button mi-button--tertiary mi-button--large">{ページ名}へ戻る</button>

</html>
